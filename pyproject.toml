[project]
name = "threatflare"
version = "0.1.0"
description = "A lightweight CLI utility to parse local system logs and dispatch threats to community intelligence feeds."
authors = [
    {name = "Alex Valentine"},
    {name = "Tyler Werner"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
